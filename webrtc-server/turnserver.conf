# The TURN server's configuration.
#
# TURN is the relay for the networks where the two parties cannot reach
# each other directly. On a mobile network that is most of the time: the
# phone is behind a carrier-grade NAT, and the only way out is through a
# relay the two of them can both reach.
#
# The relay is in Nigeria, with the media server, so the picture and the
# voice do not leave the country on their way through it.

# The ports.
listening-port=3478
tls-listening-port=5349

# The domain of the server. It is the practice's own.
realm=REPLACE_WITH_VIDEO_DOMAIN

# The public address of this server. It has to be the address the two
# parties can reach, not the private one.
external-ip=REPLACE_WITH_THE_SERVERS_PUBLIC_IP

# The range the relayed connections use.
min-port=49160
max-port=49200

# The credentials. The username and the password are the same on both
# sides: the browser is given them by the application, in the room's
# configuration, and never has to know anything else.
lt-cred-mech
user=telemedicine:REPLACE_WITH_TURN_SECRET

# The server does not need to be reachable by anything but the two parties.
no-multicast-peers
no-cli
no-loopback-peers
# The relayed addresses are not published to the world.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
