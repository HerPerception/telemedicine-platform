# The external services the application may send to, and where each of them is.
#
# TODO_LEGAL - the justifications are empty until the practice's adviser
# confirms them, and every service outside Nigeria is therefore BLOCKED.
#
# Section 41(1) of the Nigeria Data Protection Act 2023 forbids transferring
# personal data from Nigeria to another country unless the recipient has an
# adequate level of protection, or one of the conditions in section 43
# applies. Section 41(2) requires the basis for the transfer to be recorded.
# Section 43(a) is the patient's consent, given after being informed of the
# risks of the transfer.
#
# So a service outside Nigeria needs, before anything may be sent to it:
#
#   lawful_basis:   consent | contract | vital_interest | public_interest |
#                   legal_claim
#   justification:  what the transfer is for, in the practice's own words
#
# **While the justification is empty, the service is blocked**, and the
# request is refused with "Transfer blocked: no lawful basis recorded per
# NDPA s43" or "Transfer blocked: no justification recorded per NDPA s41(2)".
#
# An example of a filled-in entry, from the practice's own words:
#
#   sendgrid.lawful_basis: consent
#   sendgrid.justification: Patient consented to email receipts, see consent ID
#
# The services below are listed by their API host. A destination that is not
# listed at all is refused as well: it cannot be shown to be in Nigeria, and
# showing it is the whole point. The practice's own services — its mail
# server, its media server — are listed here too, with `country: NG`, and a
# transfer to one of them is not a transfer at all.
#
# Run `python3 scripts/audit_external_services.py` to see the list, where each
# service is, and whether anything has been sent to it.

# --- email ---------------------------------------------------------------
# Both of these are in the United States. A receipt about a consultation is
# health data, so a transfer to either of them is a transfer out of Nigeria.

sendgrid.host: api.sendgrid.com
sendgrid.country: US
sendgrid.lawful_basis:
sendgrid.justification:

